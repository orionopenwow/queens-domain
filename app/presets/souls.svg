<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-souls" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140f0c"/>
      <stop offset="100%" stop-color="#080605"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff3b00"/>
      <stop offset="50%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ffeeaa"/>
    </linearGradient>
    <filter id="glow-ember" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="160" fill="url(#bg-souls)"/>
  <!-- Blood Moon -->
  <circle cx="200" cy="55" r="42" fill="#301815" stroke="#68241e" stroke-width="1.5" opacity="0.8"/>
  <circle cx="200" cy="55" r="48" fill="#ff4d2e" opacity="0.08" filter="url(#glow-ember)"/>
  <!-- Gothic Castle Spires Silhouette -->
  <path d="M0 160 L0 120 L40 100 L60 125 L90 85 L105 125 L140 115 L165 75 L180 125 L200 65 L220 125 L245 80 L270 120 L310 90 L335 125 L370 105 L400 120 L400 160 Z" fill="#0c0907"/>
  <path d="M60 160 L120 110 L140 160 L260 160 L280 115 L340 160 Z" fill="#110d0a"/>
  <!-- Bonfire Coiled Sword -->
  <g transform="translate(200, 115)">
    <!-- Ash Mound -->
    <path d="M-30 25 C-15 15 15 15 30 25 Z" fill="#241b16" stroke="#423024" stroke-width="1"/>
    <!-- Coiled Sword -->
    <line x1="0" y1="20" x2="-4" y2="-25" stroke="#948b83" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12" y1="-18" x2="4" y2="-16" stroke="#c2b6a8" stroke-width="2.5"/>
    <circle cx="-5" cy="-28" r="3" fill="#ffaa44"/>
    <!-- Fire Flame / Embers -->
    <path d="M-12 20 Q-15 0 0 -12 Q15 0 12 20 Q0 15 -12 20 Z" fill="url(#ember)" filter="url(#glow-ember)" opacity="0.9"/>
    <path d="M-6 18 Q-8 5 0 -4 Q8 5 6 18 Z" fill="#fff" opacity="0.85"/>
    <!-- Rising Embers -->
    <circle cx="-14" cy="-8" r="1.5" fill="#ffaa33" filter="url(#glow-ember)"/>
    <circle cx="16" cy="-14" r="1.8" fill="#ff8800" filter="url(#glow-ember)"/>
    <circle cx="4" cy="-24" r="1.2" fill="#ffee88"/>
    <circle cx="-8" cy="-32" r="1.5" fill="#ff5500"/>
  </g>
  <!-- Badges -->
  <rect x="14" y="14" width="140" height="24" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="26" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffaa55">🗡️ ELDEN SOULSLIKE</text>
  <rect x="310" y="14" width="76" height="24" rx="12" fill="rgba(255,170,85,0.15)" stroke="rgba(255,170,85,0.4)" stroke-width="1"/>
  <text x="323" y="30" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#ffaa55">32 STEPS</text>
</svg>