<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-scifi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="grid-neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="glow-neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="160" fill="url(#bg-scifi)"/>
  <!-- Cyberpunk Horizon Sun / Grid -->
  <circle cx="200" cy="85" r="45" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.6" filter="url(#glow-neon)"/>
  <circle cx="200" cy="85" r="38" fill="#1e1026" stroke="#a855f7" stroke-width="1.5"/>
  <!-- Perspective Cyber Grid -->
  <g stroke="rgba(0,240,255,0.25)" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="115" x2="400" y2="115"/>
    <line x1="0" y1="135" x2="400" y2="135"/>
    <line x1="0" y1="158" x2="400" y2="158"/>
    <line x1="200" y1="90" x2="0" y2="160"/>
    <line x1="200" y1="90" x2="80" y2="160"/>
    <line x1="200" y1="90" x2="150" y2="160"/>
    <line x1="200" y1="90" x2="250" y2="160"/>
    <line x1="200" y1="90" x2="320" y2="160"/>
    <line x1="200" y1="90" x2="400" y2="160"/>
  </g>
  <!-- Cyberpunk City Skyline Silhouettes -->
  <path d="M40 90 L40 70 L65 70 L65 90 M80 90 L80 55 L105 55 L105 90 M130 90 L130 65 L155 65 L155 90 M250 90 L250 60 L275 60 L275 90 M295 90 L295 72 L320 72 L320 90 M340 90 L340 50 L365 50 L365 90" stroke="#00f0ff" stroke-width="1.2" fill="#060c14" opacity="0.8"/>
  <!-- Cyber Hologram Drone -->
  <g transform="translate(200, 50)">
    <polygon points="0,-12 18,2 0,16 -18,2" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5" filter="url(#glow-neon)"/>
    <circle cx="0" cy="2" r="3" fill="#f43f5e" filter="url(#glow-neon)"/>
    <line x1="-22" y1="-4" x2="-14" y2="0" stroke="#00f0ff" stroke-width="2"/>
    <line x1="22" y1="-4" x2="14" y2="0" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="-24" cy="-5" r="2" fill="#38bdf8"/>
    <circle cx="24" cy="-5" r="2" fill="#38bdf8"/>
  </g>
  <!-- Badges -->
  <rect x="14" y="14" width="145" height="24" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="26" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#00f0ff">🛸 CYBER ROGUELIKE</text>
  <rect x="310" y="14" width="76" height="24" rx="12" fill="rgba(0,240,255,0.15)" stroke="rgba(0,240,255,0.4)" stroke-width="1"/>
  <text x="323" y="30" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#00f0ff">35 STEPS</text>
</svg>