<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-qd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18130e"/>
      <stop offset="100%" stop-color="#090807"/>
    </linearGradient>
    <linearGradient id="pyr-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcedb6"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="pyr-base1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d5a42"/>
      <stop offset="100%" stop-color="#173525"/>
    </linearGradient>
    <linearGradient id="pyr-base2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d7557"/>
      <stop offset="100%" stop-color="#204430"/>
    </linearGradient>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="160" fill="url(#bg-qd)"/>
  <!-- Ambient grid -->
  <path d="M0 130 L400 130 M0 145 L400 145 M50 160 L150 110 M200 160 L200 110 M350 160 L250 110" stroke="rgba(212,175,55,0.08)" stroke-width="1"/>
  <circle cx="200" cy="70" r="60" fill="#d4af37" opacity="0.08" filter="url(#glow-gold)"/>
  <!-- Stepped Isometric Pyramid (Queen's Domain) -->
  <g transform="translate(200, 78)">
    <!-- Base 1 -->
    <path d="M-80 35 L0 75 L80 35 L0 -5 Z" fill="#1e1812" stroke="#4a3b2b" stroke-width="1"/>
    <!-- Base 2 Tier -->
    <path d="M-65 27 L0 60 L65 27 L0 -7 Z" fill="url(#pyr-base1)" stroke="#528a68" stroke-width="1"/>
    <!-- Base 3 Tier -->
    <path d="M-48 18 L0 42 L48 18 L0 -7 Z" fill="url(#pyr-base2)" stroke="#74b58e" stroke-width="1"/>
    <!-- Pyramid Apex Cap -->
    <path d="M0 -30 L-26 8 L0 22 Z" fill="url(#pyr-top)"/>
    <path d="M0 -30 L26 8 L0 22 Z" fill="#b08d24"/>
    <path d="M0 -30 L0 22" stroke="#fff" stroke-width="0.8" opacity="0.6"/>
  </g>
  <!-- Floating Sparkles & Emojis -->
  <circle cx="130" cy="45" r="2" fill="#fcedb6" filter="url(#glow-gold)"/>
  <circle cx="270" cy="40" r="2.5" fill="#fcedb6" filter="url(#glow-gold)"/>
  <circle cx="160" cy="110" r="1.5" fill="#74b58e"/>
  <circle cx="240" cy="115" r="1.5" fill="#74b58e"/>
  <!-- Badge Label Overlay -->
  <rect x="14" y="14" width="130" height="24" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="26" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fcedb6">👑 QUEEN'S DOMAIN</text>
  <rect x="316" y="14" width="70" height="24" rx="12" fill="rgba(16,185,129,0.18)" stroke="rgba(16,185,129,0.45)" stroke-width="1"/>
  <text x="331" y="30" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399">READY</text>
</svg>