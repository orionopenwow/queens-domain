<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sandbox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141118"/>
      <stop offset="100%" stop-color="#08070a"/>
    </linearGradient>
    <filter id="glow-gem" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="160" fill="url(#bg-sandbox)"/>
  <!-- Underground Cavern Silhouettes -->
  <path d="M0 0 L110 0 L80 40 L160 50 L190 25 L240 45 L320 20 L350 45 L400 0 L400 160 L360 140 L300 155 L260 120 L190 145 L130 115 L60 140 L0 125 Z" fill="#1c1622" stroke="#2c2236" stroke-width="1"/>
  <!-- Destructible Pixel Tile Grid Outline -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="40"/><line x1="0" y1="80" x2="400" y2="80"/><line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="80" y1="0" x2="80" y2="160"/><line x1="160" y1="0" x2="160" y2="160"/><line x1="240" y1="0" x2="240" y2="160"/><line x1="320" y1="0" x2="320" y2="160"/>
  </g>
  <!-- Glowing Gems in the Walls -->
  <polygon points="120,42 125,48 120,54 115,48" fill="#00f0ff" filter="url(#glow-gem)"/>
  <polygon points="120,42 125,48 120,54 115,48" fill="#fff"/>
  <polygon points="280,32 286,38 280,44 274,38" fill="#a855f7" filter="url(#glow-gem)"/>
  <polygon points="280,32 286,38 280,44 274,38" fill="#fff"/>
  <polygon points="150,130 156,136 150,142 144,136" fill="#10b981" filter="url(#glow-gem)"/>
  <polygon points="230,135 235,140 230,145 225,140" fill="#00f0ff" filter="url(#glow-gem)"/>
  <!-- Pickaxe in Center Cavern -->
  <g transform="translate(200, 85) rotate(-35)">
    <!-- Wooden Handle -->
    <rect x="-3" y="-30" width="6" height="60" rx="2" fill="#8c6239" stroke="#5c3e21" stroke-width="1"/>
    <!-- Iron Pick Head -->
    <path d="M-28 -28 Q0 -18 28 -28 Q18 -38 0 -36 Q-18 -38 -28 -28 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <circle cx="0" cy="-28" r="4" fill="#475569"/>
    <!-- Impact Sparkles -->
    <circle cx="28" cy="-28" r="2" fill="#00f0ff" filter="url(#glow-gem)"/>
    <circle cx="34" cy="-22" r="1.5" fill="#facc15"/>
    <circle cx="32" cy="-35" r="1.2" fill="#fff"/>
  </g>
  <!-- Badges -->
  <rect x="14" y="14" width="140" height="24" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="26" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">⛏️ CORE DELVER</text>
  <rect x="310" y="14" width="76" height="24" rx="12" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
  <text x="323" y="30" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#38bdf8">28 STEPS</text>
</svg>